services:
  db:
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: localcontainer
    volumes:
      - ./db-data:/var/lib/postgresql

  meleeindex.api:
    image: meleeindex.api
    build:
      context: .
      dockerfile: MeleeIndex.API/Dockerfile
